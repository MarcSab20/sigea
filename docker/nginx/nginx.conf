server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interne Docker : re-résolution des services à chaque requête
    # (évite les 502 quand un backend est recréé avec une nouvelle IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── API → gateway ──
    location /api/ {
        proxy_pass http://gateway:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket notifications → notification-service (socket.io :3007) ──
    location /notifications/ {
        proxy_pass http://notification-service:3007$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── index.html : TOUJOURS revalidé ──
    # Sans corps de cache : le navigateur récupère le nouvel index à chaque
    # déploiement, donc pointe vers le nouveau bundle haché. C'est LA clé pour
    # que les mises à jour soient prises en compte sans vider le cache à la main.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files /index.html =404;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Assets hachés : immuables (le hash change à chaque build) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options         "DENY";
    add_header X-Content-Type-Options  "nosniff";
    add_header Referrer-Policy         "strict-origin-when-cross-origin";
}